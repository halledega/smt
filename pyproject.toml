[project]
name = "smt"
version = "0.1.0"
description = "A structural engineering tool for calculating punching shear capacity and designing Stud Shear Reinforcement (SSR) to CSA A23.3-19."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Michael Halliday", email = "mhalliday82@gmail.com" }
]
keywords = [
    "structural-engineering",
    "punching-shear",
    "csa-a23-3",
    "concrete-design",
    "civil-engineering",
    "stud-shear-reinforcement",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.2.0",
    "marimo>=0.22.4",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "plotly>=6.6.0",
    "pytest>=9.0.2",
    "shapely>=2.0.0",
]

# Grouping optional dependencies keeps the core package lightweight
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
notebook = [
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
]

# --- Tool Configurations ---

[tool.ruff]
# Standardize formatting to keep the codebase clean before hitting the Beta phase
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"] # Flake8 and Isort rules (keeps imports organized)

[tool.pytest.ini_options]
# Tells pytest exactly where to look for your hand-calc verification Tests
minversion = "8.0"
addopts = "-ra -v"
testpaths = [
    "Tests",
]
